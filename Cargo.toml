[package]
name = "jailer"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.31.3", features = [
    "process",
    "sched",
    "signal",
    "term",
    "mount",
    "fs",
] }
clap = { version = "4.6.7", features = ["derive"] }
cgroups-rs = "0.5.1"
nanoid = "0.5.0"
tokio = { version = "1", features = ["full"] }
rtnetlink = "0.23"
futures = "0.3"
futures-lite = "2.6.1"
reqwest = { version = "0.13.5", features = ["json"] }
serde = "1.0.229"
anyhow = "1.0.104"
sha2 = "0.11.1"
serde_json = "1.0.154"
flate2 = "1.0"
tar = "0.4"
