[package]
name = "jailer"
version = "0.1.0"
edition = "2024"

[dependencies]
nix = { version = "0.31.3", features = [
    "process",
    "sched",
    "signal",
    "term",
    "mount",
    "fs",
] }
clap = { version = "4.6.7", features = ["derive"] }
cgroups-rs = "0.5.1"
nanoid = "0.5.0"
tokio = { version = "1", features = ["full"] }
rtnetlink = "0.23"
futures = "0.3"
futures-lite = "2.6.1"
